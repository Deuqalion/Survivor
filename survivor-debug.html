<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Metin2 Survivor — DEBUG</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="survivor.css">
</head>

<body>

  <!-- Stała scena 1920x1080 (proporcje tlo.png 16:9), skalowana JS-em do okna -->
  <div id="stage">

    <!-- ================= LEWY PANEL: EKWIPUNEK + STATY ================= -->
    <section id="panel-lewy">

      <div class="postac-naglowek">🛡️ Ekwipunek 🏹</div>

      <section id="plansza-1" class="plansza"></section>

      <div class="liczniki-rzad">
        <span id="zmianki-wrap" class="licznik">ZMIANKI: <span id="zmianki-licznik">0</span> 🎲</span>
        <span class="licznik">ZABICI: <span id="zabici-licznik">0</span> ☠️</span>
      </div>

      <div id="staty-gracza"></div>

    </section>

    <!-- ================= ARENA ================= -->
    <section class="survivor-canvas-wrap">
      <canvas id="gra-canvas"></canvas>

      <div class="survivor-hud">
        <div class="pasek-hp-wrapper">
          <div class="pasek-hp-etykieta">
            <span>Twoje PŻ</span>
            <span id="hp-tekst-gracz">0 / 0</span>
          </div>
          <div class="pasek-hp-tlo">
            <div id="hp-fill-gracz" class="pasek-hp-fill"></div>
          </div>
        </div>
        <span id="survivor-info" class="survivor-info"></span>
      </div>
    </section>

    <!-- ================= DOLNY PASEK: PRZYCISKI ================= -->
    <div class="pasek-przyciskow">
      <button id="btn-start-gry" class="btn-img" type="button" onclick="rozpocznijGre()">
        <img src="START.png" alt="START">
      </button>
      <button id="btn-pauza-gry" class="btn-img" type="button" onclick="przelaczPauze()" disabled>
        <img id="img-pauza" src="PAUZA.png" alt="PAUZA">
      </button>
      <button id="btn-wiki-gry" class="btn-img" type="button" onclick="otworzWiki()">
        <img src="WIKI.png" alt="WIKI">
      </button>
    </div>

  </div>

  <!-- ================= WIKI PRZEDMIOTÓW ================= -->
  <div id="wiki-overlay" aria-hidden="true">
    <section id="wiki-okno" role="dialog" aria-modal="true" aria-labelledby="wiki-tytul">
      <h1 id="wiki-tytul">WIKIPEDIA PRZEDMIOTÓW</h1>
      <div id="wiki-grid"></div>
      <button id="wiki-zamknij" class="wiki-zamknij" type="button" onclick="zamknijWiki()">
        <img src="ZAMKNIJ.png" alt="ZAMKNIJ">
      </button>
    </section>
  </div>

  <!-- TOOLTIP 401x704 (poza sceną — skalowany osobno przez --skala) -->
  <div id="tooltip" class="tooltip">
    <img id="tooltip-item" class="tooltip-item" src="" alt="">
    <div class="tooltip-affix">
      <div id="tooltip-affix-list" class="tooltip-affix-list"></div>
    </div>
  </div>

  <!-- ================= PANEL DEBUG (tylko ta wersja) ================= -->
  <style>
    #debug-panel {
      position: fixed; right: 10px; bottom: 10px; z-index: 40000;
      display: flex; flex-direction: column; gap: 6px;
      padding: 8px 10px; border-radius: 8px;
      background: rgba(0, 0, 0, 0.75); border: 1px solid #ff4d4d;
      font: 13px/1.2 Arial, sans-serif; color: #fff;
    }
    #debug-panel b { color: #ff4d4d; letter-spacing: 1px; }
    #debug-panel button {
      cursor: pointer; padding: 5px 8px; border-radius: 5px;
      border: 1px solid #888; background: #222; color: #fff; text-align: left;
    }
    #debug-panel button:hover { background: #3a3a3a; }
  </style>
  <div id="debug-panel">
    <b>🛠 DEBUG</b>
    <button type="button" onclick="debugJedenPz()">💀 Zostaw mi 1 PŻ (test Wskrzeszenia)</button>
    <button type="button" onclick="debugResetWskrzeszenia()">✨ Odnów Wskrzeszenie</button>
    <button type="button" onclick="debugFalaArcybossa()">👹 Fala Arcybossa teraz</button>
    <button type="button" onclick="debugDodajZmianki()">🎲 +100 Zmianek</button>
  </div>

  <script src="config.js"></script>
  <script src="generator.js"></script>
  <script src="statystyki.js"></script>
  <script src="survivor-stats.js"></script>
  <script src="survivor-game.js"></script>
  <script src="survivor-debug.js"></script>

</body>
</html>
